[project]
name = "fantasy-football-2026"
version = "0.1.0"
description = "PDF tools for preparing a 2026 fantasy football draft sheet."
authors = [
    { name = "Joseph Jackson" },
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
keywords = ["fantasy-football", "draft", "rankings", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "pdfplumber>=0.11,<1.0",
    "pymupdf>=1.26,<2",
    "pypdf>=6.16.2,<7",
    "reportlab>=4.2,<5",
]

[project.scripts]
fantasy-pdf = "fantasy_football_2026.cli:main"
fantasy-injuries = "fantasy_football_2026.sources.injuries:main"
fantasy-depth-charts = "fantasy_football_2026.sources.depth_charts:main"
fantasy-team-context = "fantasy_football_2026.sources.teams:main"
fantasy-schedule = "fantasy_football_2026.sources.schedule:main"
fantasy-market = "fantasy_football_2026.sources.market:main"
fantasy-projections = "fantasy_football_2026.sources.projections:main"
fantasy-sleepers = "fantasy_football_2026.consensus.sleepers:main"
fantasy-handcuffs = "fantasy_football_2026.consensus.handcuffs:main"
fantasy-rankings = "fantasy_football_2026.domain.rankings:main"
fantasy-rebuild = "fantasy_football_2026.application.rebuild:main"

[tool.poetry]
packages = [
    { include = "fantasy_football_2026", from = "src" },
]
include = ["src/fantasy_football_2026/py.typed"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
ruff = ">=0.12,<1"

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
